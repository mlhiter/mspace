<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">mspace local agent workflow</title>
  <desc id="desc">A diagram showing the mspace desktop app, server control plane, runtime worker, Codex app-server, git worktree, and Kubernetes test namespace.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c6f64"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#f3efe8"/>
  <rect x="42" y="42" width="1116" height="536" rx="24" fill="#fbfaf7" stroke="#ddd7ce"/>

  <text x="82" y="95" fill="#171512" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700">mspace</text>
  <text x="82" y="125" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Server-owned issue workspace for coding agents and Kubernetes validation evidence</text>

  <g filter="url(#softShadow)">
    <rect x="82" y="174" width="252" height="278" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
    <circle cx="118" cy="214" r="12" fill="#2d2926"/>
    <text x="146" y="220" fill="#171512" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Desktop workspace</text>
    <text x="110" y="264" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Inbox</text>
    <text x="110" y="303" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Issues and comments</text>
    <text x="110" y="342" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Agent engines</text>
    <text x="110" y="381" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Project runtime settings</text>
    <rect x="110" y="407" width="176" height="1" fill="#e8e2d8"/>
    <text x="110" y="434" fill="#9a8e82" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Electron + React + shadcn/ui</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="474" y="158" width="252" height="126" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
    <text x="504" y="199" fill="#171512" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Server control plane</text>
    <text x="504" y="232" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Postgres state, tasks, logs</text>
    <text x="504" y="257" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Workers claim queued turns</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="474" y="336" width="252" height="126" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
    <text x="504" y="377" fill="#171512" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Codex app-server</text>
    <text x="504" y="410" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Thread, turn, status, logs</text>
    <text x="504" y="435" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Runs inside a prepared worktree</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="866" y="158" width="252" height="126" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
    <text x="896" y="199" fill="#171512" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Git worktree</text>
    <text x="896" y="232" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">~/.mspace/workdirs</text>
    <text x="896" y="257" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Diffs, commits, branch evidence</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="866" y="336" width="252" height="126" rx="18" fill="#ffffff" stroke="#d8d1c7"/>
    <text x="896" y="377" fill="#171512" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Kubernetes test env</text>
    <text x="896" y="410" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Issue-scoped namespace</text>
    <text x="896" y="435" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Preview URL, events, logs</text>
  </g>

  <path d="M 346 234 C 392 234 416 221 456 221" stroke="#7c6f64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 600 292 L 600 318" stroke="#7c6f64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 738 221 C 784 221 808 221 848 221" stroke="#7c6f64" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 738 399 C 784 399 808 399 848 399" stroke="#7c6f64" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="82" y="503" width="1036" height="1" fill="#e8e2d8"/>
  <text x="82" y="537" fill="#756a5f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Flow: create issue -> mention agent -> review session output -> deploy test namespace -> keep preview and evidence on the issue.</text>
</svg>
