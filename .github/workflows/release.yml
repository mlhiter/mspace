name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and attach release artifacts for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate tagged release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      build_time: ${{ steps.identity.outputs.build_time }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Resolve and verify release identity
        id: identity
        shell: bash
        run: |
          if [ ! -f scripts/resolve-release-identity.mjs ] || [ ! -f apps/desktop/scripts/prepare-release.mjs ]; then
            echo "::error::${RELEASE_TAG} predates trustworthy packaged build identity. Create a patched point release instead of mixing current packaging tools with old tagged source."
            exit 1
          fi
          node scripts/resolve-release-identity.mjs \
            --tag="${RELEASE_TAG}" \
            --github-output="${GITHUB_OUTPUT}" \
            --github-env="${GITHUB_ENV}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript packages
        run: pnpm typecheck

      - name: Build desktop app
        run: pnpm --filter @mspace/desktop build

      - name: Build website
        run: pnpm --filter @mspace/website build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.0"
          cache-dependency-path: "**/go.sum"

      - name: Test server
        working-directory: server
        run: go test ./...

      - name: Build server
        working-directory: server
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/mlhiter/mspace/server/internal/control.version=${MSPACE_BUILD_VERSION} -X github.com/mlhiter/mspace/server/internal/control.commitSHA=${MSPACE_BUILD_COMMIT_SHA} -X github.com/mlhiter/mspace/server/internal/control.buildTime=${MSPACE_BUILD_TIME}" \
            ./cmd/server

      - name: Test worker
        run: |
          if [ -d worker ]; then
            (cd worker && go test ./...)
            (cd worker && go build -trimpath -ldflags="-s -w -X main.workerVersion=${MSPACE_BUILD_VERSION}" ./...)
          elif [ -d runner ]; then
            (cd runner && go test ./...)
            (cd runner && go build -trimpath -ldflags="-s -w -X main.workerVersion=${MSPACE_BUILD_VERSION}" ./...)
          else
            echo "No worker/ or runner/ runtime directory found." >&2
            exit 1
          fi

      - name: Write release verification summary
        run: |
          mkdir -p release-artifacts
          {
            echo "# ${RELEASE_TAG}"
            echo
            echo "- Tag: ${RELEASE_TAG}"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- TypeScript typecheck: passed"
            echo "- Desktop build: passed"
            echo "- Website build: passed"
            echo "- Server tests/build: passed"
            echo "- Runtime tests/build: passed"
            echo
            echo "This workflow validates the tagged source and publishes desktop installers for macOS, Windows, and Linux. It does not publish container images, npm packages, or production deployments."
          } > release-artifacts/release-verification.md

      - name: Upload release verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ env.RELEASE_TAG }}
          path: release-artifacts/release-verification.md
          if-no-files-found: error

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-artifacts/release-verification.md --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              ${prerelease_flag} \
              --generate-notes \
              --title "${RELEASE_TAG}" \
              release-artifacts/release-verification.md
          fi

  package-desktop:
    name: Package ${{ matrix.name }} desktop app
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            release-target: darwin
            release-arch: universal
            electron-builder-target: --mac
            artifact-name: desktop-macos
            artifact-path: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
            upload-globs: apps/desktop/dist/*.dmg apps/desktop/dist/*.zip
          - name: Windows
            runner: windows-latest
            release-target: win32
            release-arch: x64
            electron-builder-target: --win --x64
            artifact-name: desktop-windows
            artifact-path: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.zip
            upload-globs: apps/desktop/dist/*.exe apps/desktop/dist/*.zip
          - name: Linux
            runner: ubuntu-latest
            release-target: linux
            release-arch: x64
            electron-builder-target: --linux --x64
            artifact-name: desktop-linux
            artifact-path: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
              apps/desktop/dist/*.rpm
            upload-globs: apps/desktop/dist/*.AppImage apps/desktop/dist/*.deb apps/desktop/dist/*.rpm
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      MSPACE_BUILD_VERSION: ${{ needs.validate.outputs.version }}
      MSPACE_BUILD_COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
      MSPACE_BUILD_TIME: ${{ needs.validate.outputs.build_time }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify packaged checkout identity
        shell: bash
        run: |
          if [ ! -f scripts/resolve-release-identity.mjs ] || [ ! -f apps/desktop/scripts/prepare-release.mjs ]; then
            echo "::error::${RELEASE_TAG} predates trustworthy packaged build identity. Create a patched point release instead of mixing current packaging tools with old tagged source."
            exit 1
          fi
          node scripts/resolve-release-identity.mjs --tag="${RELEASE_TAG}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.0"
          cache-dependency-path: "**/go.sum"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled release binaries
        run: node apps/desktop/scripts/prepare-release.mjs --target=${{ matrix.release-target }} --arch=${{ matrix.release-arch }}

      - name: Build desktop app
        run: pnpm --filter @mspace/desktop exec electron-vite build

      - name: Build desktop installers
        run: pnpm --filter @mspace/desktop exec electron-builder ${{ matrix.electron-builder-target }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ env.RELEASE_TAG }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Attach desktop artifacts to draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" ${{ matrix.upload-globs }} --clobber
