appId: app.mspace.desktop
productName: mspace
copyright: Copyright © 2026 mspace
asar: true

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - assets/**

extraResources:
  - from: resources/bin/mspace-server
    to: bin/mspace-server

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: mspace ${version}
  contents:
    - x: 150
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
