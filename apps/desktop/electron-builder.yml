appId: app.mspace.desktop
productName: mspace
copyright: Copyright © 2026 mspace
asar: true

protocols:
  - name: mspace invite links
    schemes:
      - mspace

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - assets/**

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

linux:
  category: Development
  icon: build/icon.png
  maintainer: mspace
  synopsis: Issue workspace for coding agents
  description: Desktop workspace plus server control plane for coding agents, issue review, and Kubernetes validation evidence.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

dmg:
  title: mspace ${version}
  contents:
    - x: 150
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
