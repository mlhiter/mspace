{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mspace.fullname" . }}-server-ingress
  labels:
    {{- include "mspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mspace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8787
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mspace.fullname" . }}-buildkit-worker-only
  labels:
    {{- include "mspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mspace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: buildkit
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mspace.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: {{ .Values.buildkit.service.port }}
{{- end }}
