{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mspace.secretName" . }}
  labels:
    {{- include "mspace.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "mspace.databaseUrl" . | quote }}
  MSPACE_GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  MSPACE_GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  MSPACE_GITHUB_REDIRECT_URI: {{ .Values.secrets.githubRedirectUri | quote }}
  MSPACE_SERVER_ADMIN_LOGINS: {{ .Values.secrets.serverAdminLogins | quote }}
  MSPACE_BOOTSTRAP_ADMIN_LOGIN: {{ .Values.secrets.bootstrapAdminLogin | quote }}
  MSPACE_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  MSPACE_BOOTSTRAP_ADMIN_NAME: {{ .Values.secrets.bootstrapAdminName | quote }}
  MSPACE_BOOTSTRAP_ADMIN_EMAIL: {{ .Values.secrets.bootstrapAdminEmail | quote }}
  {{- if not .Values.secrets.runtimeTokenExistingSecret }}
  MSPACE_RUNTIME_TOKEN: {{ .Values.secrets.runtimeToken | quote }}
  {{- end }}
{{- end }}
