namespace:
  create: true
  name: mspace-system

secrets:
  create: true
  githubClientId: "replace-me"
  githubClientSecret: "replace-me"
  githubRedirectUri: "https://mspace.example.com/api/auth/github/callback"
  # Comma-separated local password logins or GitHub logins allowed to create team workspaces.
  serverAdminLogins: "admin"
  bootstrapAdminLogin: "admin"
  bootstrapAdminPassword: "replace-with-a-long-random-password"
  bootstrapAdminName: "Admin"
  bootstrapAdminEmail: "admin@example.com"

bootstrap:
  teamWorkspace:
    enabled: true
    name: Customer Team
  runtimeToken:
    name: Helm fixed worker
    expiresInHours: 2160

server:
  image:
    repository: crpi-7jr40k6elhldekqp.cn-hangzhou.personal.cr.aliyuncs.com/mlhiter/mspace-server
    tag: replace-me
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: mspace.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

worker:
  enabled: true
  image:
    repository: crpi-7jr40k6elhldekqp.cn-hangzhou.personal.cr.aliyuncs.com/mlhiter/mspace-worker-codex
    tag: replace-me

codexHome:
  # kubectl -n mspace-system create secret generic mspace-codex-home \
  #   --from-file=auth.json=/path/to/worker-codex-home/auth.json \
  #   --from-file=config.toml=deploy/codex/worker-config.toml
  existingSecret: mspace-codex-home
  configKey: config.toml

kubeconfig:
  # kubectl -n mspace-system create secret generic mspace-customer-kubeconfig --from-file=config=/path/to/customer.kubeconfig
  existingSecret: mspace-customer-kubeconfig
  mountPath: /etc/mspace/kubeconfigs/customer.kubeconfig

postgresql:
  enabled: true
  persistence:
    size: 20Gi

buildkit:
  enabled: false
